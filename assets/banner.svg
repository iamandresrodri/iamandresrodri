<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#26262A"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0B0C" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0B0B0C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#0B0B0C"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#fade)"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="96" font-size="15" fill="#8A8A90" letter-spacing="2.4">PRODUCT MARKETING · MONTREAL</text>
    <text x="70" y="172" font-size="64" font-weight="600" fill="#F5F5F7" letter-spacing="-1.6">Andres Rodriguez</text>
    <text x="72" y="222" font-size="22" fill="#A1A1A8">I position products, then build the tools to launch them.</text>
    <g font-size="15" fill="#6E6E75">
      <rect x="72" y="250" width="46" height="26" rx="6" fill="none" stroke="#2E2E33"/>
      <text x="85" y="268">FR</text>
      <rect x="126" y="250" width="46" height="26" rx="6" fill="none" stroke="#2E2E33"/>
      <text x="139" y="268">EN</text>
      <rect x="180" y="250" width="46" height="26" rx="6" fill="none" stroke="#2E2E33"/>
      <text x="194" y="268">ES</text>
    </g>
    <g text-anchor="end" font-size="30" font-weight="500" letter-spacing="-0.6">
      <text x="1208" y="128" fill="#3A3A40">Positionnement.</text>
      <text x="1208" y="172" fill="#F5F5F7">Positioning.</text>
      <text x="1208" y="216" fill="#3A3A40">Posicionamiento.</text>
    </g>
  </g>
